[build-system]
requires = ["scikit-build-core>=0.10", "nanobind==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "nhc"
version = "0.1.0"
description = "Heston calibration in C++20/Python: analytic-gradient COS+LM baseline vs neural surrogate & warm-start"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Carlos Suarez", email = "CarlosDsuarez@users.noreply.github.com" },
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "torch>=2.5",
  "matplotlib>=3.9",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "QuantLib>=1.36",
  "nanobind==3.1.0",
  "scikit-build-core>=0.10",
]

[tool.scikit-build]
minimum-version = "0.10"
wheel.packages = ["python/nhc"]
cmake.args = [
  "-DNHC_BUILD_PYTHON=ON",
  "-DNHC_BUILD_TESTS=OFF",
  "-DNHC_BUILD_TOOLS=OFF",
]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
